name: Build & push Chatwoot image (webcam)

# Builds a custom Chatwoot image with the native webcam-recorder button and
# pushes it to GHCR. Point the Railway chatwoot-web/chatwoot-worker services at
# the resulting image. The frontend patch is baked in via the official
# docker/Dockerfile (COPY . /app + rake assets:precompile).

on:
  push:
    branches: [feat/webcam-recorder]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot:webcam
            ghcr.io/${{ github.repository_owner }}/chatwoot:webcam-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
